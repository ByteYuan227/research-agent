# Developer tool for building the form filler against real application pages.
# It never submits an application: probe_forms.py only reads forms, and
# dry_run_fill.py fills them with the fictional example profile and stops
# before the submit button. Results go to the probe-data-<script> branch.
name: dev-probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: probe_forms or dry_run_fill
        default: probe_forms
      urls_file:
        description: JSON file with a list of job/application URLs
        default: scripts/probe_urls.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python "scripts/${{ inputs.script }}.py" "${{ inputs.urls_file }}" probe-out
      - name: Push results to the probe-data branch
        if: always()
        run: |
          cd probe-out
          git init -q -b probe-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "${{ inputs.script }} run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:probe-data-${{ inputs.script }}
