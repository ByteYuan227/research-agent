# Daily job hunt: discover roles, let Claude score, tailor and apply, post a report.
#
# Claude runs through Claude Code with your Claude subscription
# (secret CLAUDE_CODE_OAUTH_TOKEN, created with `claude setup-token`), or an
# API key (secret ANTHROPIC_API_KEY). Setup: README.md.
name: job-hunt

on:
  schedule:
    # Cron is UTC. One of these is 19:17 in New York depending on daylight
    # saving; the gate below lets only that one through, so the report lands
    # in the evening Eastern time all year.
    - cron: "17 23 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearsal - prepare everything but never submit
        type: boolean
        default: false

permissions:
  contents: write # encrypted state on the jobagent-data branch
  issues: write # the daily report

concurrency:
  group: job-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JOBAGENT_HOME: ${{ github.workspace }}/.jobagent
      JOBAGENT_PROFILE_YAML: ${{ secrets.JOBAGENT_PROFILE_YAML }}
      JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
      JOBAGENT_IMAP_USER: ${{ secrets.JOBAGENT_IMAP_USER }}
      JOBAGENT_IMAP_PASSWORD: ${{ secrets.JOBAGENT_IMAP_PASSWORD }}
      JOBAGENT_CLAUDE_MODEL: ${{ vars.JOBAGENT_CLAUDE_MODEL }}
      JOBAGENT_MAX_MINUTES: "300"
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Only run at 7pm New York time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=America/New_York date +%H)" = "19" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - name: Detect repository visibility
        id: repo
        if: steps.gate.outputs.go == 'true'
        run: |
          private=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            | python -c "import json,sys; print(str(json.load(sys.stdin).get('private', False)).lower())")
          echo "private=$private" >> "$GITHUB_OUTPUT"
          # Public repositories get a report without score reasons.
          if [ "$private" = "true" ]; then echo "JOBAGENT_REPORT_DETAIL=full" >> "$GITHUB_ENV"; else echo "JOBAGENT_REPORT_DETAIL=public" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -q -e .
          python -m playwright install --with-deps chromium > /dev/null
          if [ "$HAS_CLAUDE" = "true" ]; then npm install -g @anthropic-ai/claude-code > /dev/null; fi

      - name: Restore state
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ -z "$JOBAGENT_STATE_KEY" ]; then
            echo "::warning::JOBAGENT_STATE_KEY is not set: the agent cannot remember past runs."
            exit 0
          fi
          if git fetch -q origin jobagent-data 2>/dev/null; then
            git show FETCH_HEAD:state.enc > "$RUNNER_TEMP/state.enc"
            jobagent state import "$RUNNER_TEMP/state.enc"
          fi

      - name: Job hunt
        if: steps.gate.outputs.go == 'true'
        env:
          SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          # Prefer the subscription token; an API key would take precedence if both were set.
          if [ -n "$SUBSCRIPTION_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$SUBSCRIPTION_TOKEN";
          elif [ -n "$API_KEY" ]; then export ANTHROPIC_API_KEY="$API_KEY"; fi
          unset SUBSCRIPTION_TOKEN API_KEY
          if [ "$DRY_RUN_INPUT" = "true" ]; then export JOBAGENT_DRY_RUN=1; fi
          # The very first scheduled run is a rehearsal, so you can check the answers and
          # resumes in the report before anything is submitted.
          if [ "${{ github.event_name }}" = "schedule" ] && jobagent first-run | grep -q '"first_run": true'; then
            export JOBAGENT_DRY_RUN=1
            jobagent note "🧪 第一次运行按规则只做演练：所有申请都准备好了但没有提交。请检查这份日报，明天开始正式投递。"
          fi
          if [ "$HAS_CLAUDE" != "true" ]; then
            jobagent sync-checklist > /dev/null || true
            jobagent discover > /dev/null
            jobagent note "还没有配置 CLAUDE_CODE_OAUTH_TOKEN（或 ANTHROPIC_API_KEY），今天只做了岗位发现。配置方法见 README。"
            exit 0
          fi
          # The logs of each Claude session stay on the runner: they can contain personal data.
          bash scripts/daily_run.sh

      - name: Post the daily report
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          jobagent set-run run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jobagent report --out "$RUNNER_TEMP/report.md"
          jobagent notify --report "$RUNNER_TEMP/report.md"

      - name: Save state and manual-apply materials (encrypted)
        if: always() && steps.gate.outputs.go == 'true' && env.JOBAGENT_STATE_KEY != ''
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          jobagent state export "$RUNNER_TEMP/data/state.enc"
          jobagent materials export "$RUNNER_TEMP/data/materials.enc"
          cd "$RUNNER_TEMP/data"
          git init -q -b jobagent-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.enc materials.enc
          git commit -qm "job agent state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" jobagent-data

      # Resumes and screenshots contain personal data: only uploaded for private repositories.
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'true' && steps.repo.outputs.private == 'true'
        with:
          name: job-hunt-${{ github.run_id }}
          path: .jobagent/work
          retention-days: 14
          if-no-files-found: ignore
