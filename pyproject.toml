[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "两个 Claude Agent：深度研究 Agent，以及自动找岗位、改简历、投递的求职 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.5,<3",
    "pydantic>=2.7",
    "rich>=13",
    # job agent
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.48",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
research-agent = "research_agent.cli:main"
jobagent = "job_agent.cli:main"

[tool.setuptools]
packages = ["research_agent", "job_agent", "job_agent.browser"]

[tool.setuptools.package-data]
"job_agent.browser" = ["*.js"]
"job_agent" = ["resume_fonts/*.woff2", "resume_fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
