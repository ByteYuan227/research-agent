work_authorization:
  authorized_to_work_in_us: true        # 持 F-1 在读，可通过 CPT/OPT 工作，一般答 true
  requires_sponsorship_now: false       # 实习期间用 CPT/OPT，通常不需要立即 sponsor
  requires_sponsorship_future: true     # 将来需要 H-1B 就填 true
  status: "F-1 student, eligible for CPT/OPT"
  us_citizen: false                     # 美国公民？
  permanent_resident: false             # 绿卡？
  citizenships: [China]                 # 国籍（「Country of citizenship」这类问题会用到）
  visa_type: F-1
  # export_control_us_person: true      # 出口管制（ITAR/EAR）的 "U.S. person"；不填则按公民/绿卡自动判断，难民/庇护身份请填 true
  security_clearance: ""

