  first_name: Alex
  last_name: Chen
  preferred_name: ""
  email: alex.chen.example@gmail.com
  phone: "+1 555-010-0199"
  location:                         # 有些网站（如 Workday）要求填写邮寄地址
    street: "5000 Forbes Ave"
    street2: ""
    city: Pittsburgh
