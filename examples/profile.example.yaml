  requires_sponsorship_now: false       # 实习期间用 CPT/OPT，通常不需要立即 sponsor
  requires_sponsorship_future: true     # 将来需要 H-1B 就填 true
  status: "F-1 student, eligible for CPT/OPT"
  us_citizen: false

