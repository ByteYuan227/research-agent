# Job Agent 个人资料模板（示例人物，全部是虚构的）
#
# 用法：复制成 ~/.jobagent/profile.yaml（本地运行），或者把整个文件内容存进 GitHub 仓库的
# Secret「JOBAGENT_PROFILE_YAML」（云端每日运行）。不要把填好的真实资料提交进仓库。
#
# 规则：Agent 写简历、填申请表时只会使用这里的内容，绝不编造。
# - 每条经历、每个 bullet 都要有唯一的 id，定制简历时 Agent 只能「挑选和排序」这些 bullet。
# - 想让某段经历有不同侧重，就多写几条 bullet，让 Agent 按岗位挑。
# - 申请表里遇到这里没有答案的必答题，Agent 会把这个岗位放进「需要你手动处理」的清单，而不是瞎填。

