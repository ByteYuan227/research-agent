answers:
  how_did_you_hear: Online job board
  earliest_start_date: May 2027
  graduation_date: May 2027
  willing_to_relocate: true
  open_to_remote: true
  open_to_onsite: true
  salary_expectation: ""            # 留空 = 回答 "Open / negotiable"
  over_18: true
  previously_employed_at: []        # 曾经任职过的公司（遇到「是否在本公司工作过」时使用）
  previously_interviewed_at: []     # 曾经面试过的公司
  acknowledge_privacy_notices: true # 「我已阅读隐私声明」这类确认框自动勾选
  accept_agreements: true           # 服务条款、仲裁协议、同意书等自动同意（「我是美国公民」这类事实陈述不会自动勾选）
  write_answers: true               # Claude 根据你的资料写「为什么想加入」、求职信等回答；
                                    # 只有雇主明确禁止 AI 撰写的题目会留给你手动写
  eeo:                              # 自愿披露的人口信息；decline = 选「不愿透露」
    gender: decline
    race: decline
    hispanic_latino: decline
    veteran: decline
    disability: decline
  # 你还可以添加任何常见问题的标准答案，Agent 会优先使用：
  # why_interested_template: "..."
  # notice_period: "Available from May 2027"

# 事先声明：申请表里常见的背景类问题，提前写好，Agent 遇到时直接作答、自动投递。
declarations:
  criminal_record: false            # 是否有犯罪记录（felony / misdemeanor / convicted）
  pending_charges: false            # 是否有待决的刑事指控
  consent_background_check: true    # 是否同意背景调查
  consent_drug_test: true           # 是否同意药检
  non_compete: false                # 是否受竞业 / 禁止招揽协议约束
  relatives_at_company: false       # 是否有亲属在该公司工作
  government_official: false        # 是否现任 / 前任政府官员

# 自定义问答：上面都没覆盖、又反复出现的问题，写下你的标准答案。
# match 是正则表达式（不区分大小写），匹配问题文字；命中时优先使用你的答案，覆盖所有内置规则。
custom_answers:
  - {match: "pronoun", answer: "He/him"}
  - {match: "languages? (do you|you) speak|fluent in", answer: ["English", "Mandarin"]}
  - {match: "notice period", answer: "Available from May 2027"}
  - {match: "(hours|days) per week|part[- ]time during", answer: "Full-time during the internship"}

# 关于我：几条自由文本。遇到上面都没覆盖的问题时，Claude 会依据这些事实作答（只用这里写的事实）。
about_me:
  - "Native Mandarin speaker, fluent in English."
  - "Can intern May-August 2027 and start full-time in June 2027 after graduating."
  - "Open to relocating anywhere in the US; prefer the Bay Area or Seattle."

preferences:
  job_types: [internship]           # internship / new_grad / full_time
  terms: [Summer 2027]              # 实习季；留空 = 不限
  categories: [AI/ML/Data, Software]
  title_include: []                 # 正则；留空 = 不限标题
  title_exclude: ['\bsenior\b', '\bstaff\b', '\bprincipal\b', '\bmanager\b', '\bdirector\b', '\bsales\b']
  keywords: [machine learning, ml, ai, llm, inference, infrastructure, systems, software engineer, research]
  locations: []                     # 例如 ["CA", "New York", "Remote"]；留空 = 美国任意地点
  exclude_companies: []
  posted_within_days: 14
  min_score: 75                     # Claude 打分 >= 这个分数才投
  max_applications_per_day: null    # null = 不设上限；也可以填数字
  max_per_company: null             # 同一家公司 30 天内最多投几个（挑分最高的）；null = 不限
  max_candidates_per_run: 150       # 每天最多让 Claude 细读多少个岗位
  auto_apply: true                  # false = 只准备材料、不自动提交（所有招聘网站都会自动投）
  sources:
    simplify_internships: true
    simplify_new_grad: false
    companies:                      # 额外关注的公司（Greenhouse / Lever / Ashby 招聘页）
      - {name: Anthropic, ats: greenhouse, token: anthropic}
      - {name: OpenAI, ats: ashby, token: openai}

notify:
  github_username: ByteYuan227       # 每日报告 issue 里 @ 你，GitHub 会推送通知
  email_to: ""                      # 可选：同时发邮件（需要配置 SMTP）
  language: zh
