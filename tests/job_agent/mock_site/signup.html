<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Create your candidate account - Mock Careers</title></head>
<body>
<h1>Create a candidate account to apply</h1>
<form id="f">
  <div class="field-wrapper"><label for="email">Email address *</label><input id="email" name="email" type="email" required></div>
  <div class="field-wrapper"><label for="password">Password *</label><input id="password" name="password" type="password" required></div>
  <div class="field-wrapper"><label for="password2">Confirm password *</label><input id="password2" name="password2" type="password" required></div>
  <div class="field-wrapper"><label for="first">First name *</label><input id="first" name="first" required></div>
  <button type="submit">Create account and submit application</button>
</form>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    localStorage.setItem("signup", JSON.stringify(d));
    document.body.innerHTML = d.password && d.password === d.password2
      ? "<h1>Thank you for applying!</h1>" : "<p>Passwords do not match</p>";
  });
</script>
</body></html>
